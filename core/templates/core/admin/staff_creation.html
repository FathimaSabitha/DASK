{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brightloop | Create Staff Account</title>
    <link rel="stylesheet" href="{% static 'core/css/staff_creation.css' %}">
</head>
<body>

    <div class="container">
        <a href="{% url 'product_list' %}" style="display:inline-block; margin-bottom:16px; color:#2563eb; text-decoration:none; font-weight:700; font-size:0.85rem;">← Back to Administration</a>

        <div class="header">
            <h2>Create Staff Account</h2>
            <p>Add a new internal staff member with operational access (SRS Section 3.1, FR-07)</p>
        </div>

        {% for message in messages %}
            <div class="success-message">{{ message }}</div>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create Staff Account</button>
        </form>
    </div>

</body>
</html>
