{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration | Brightloop</title>
    <link rel="stylesheet" href="{% static 'core/css/registration.css' %}">
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
            <span class="brand-title">Brightloop</span>
        </div>

        <h2>Create Your Account</h2>
        <p class="subtitle">Register to manage your subscriptions and invoices.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success" role="status">✓ {{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" novalidate>
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Create Account</button>
        </form>

        <p class="login">
            Already have an account? <a href="{% url 'login' %}">Login</a>
        </p>
    </div>

</body>
</html>
