{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Create New Password | Brightloop</title>
    <link rel="stylesheet" href="{% static 'core/css/registration.css' %}">
</head>
<body>

<div class="container">

    <h2>Create New Password</h2>

    {% if validlink %}

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Reset Password</button>
        </form>

    {% else %}

        <p>This password reset link is invalid or expired.</p>

        <a href="{% url 'password_reset' %}">
            Request a New Link
        </a>

    {% endif %}

</div>

</body>
</html>
