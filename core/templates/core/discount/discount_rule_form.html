{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Brightloop</title>
    <link rel="stylesheet" href="{% static 'core/products/product-creation.css' %}">
</head>
<body>
    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f8fafc; padding:20px;">
        <div style="max-width:580px; width:100%; background:#ffffff; border:1px solid var(--border); border-radius:12px; padding:32px; box-shadow:0 4px 16px rgba(0,0,0,0.06);">
            <h1 style="color:var(--navy); font-size:1.35rem; margin:0 0 8px;">{{ title }} (FR-33, FR-34, FR-35)</h1>
            <p style="color:var(--slate); font-size:0.85rem; margin-bottom:24px;">Configure percentage or fixed commercial discounts with qualification thresholds and validity limits.</p>

            <form method="post">
                {% csrf_token %}
                <div style="margin-bottom:16px;">
                    <label style="display:block; font-size:0.8rem; font-weight:700; color:var(--slate); margin-bottom:6px;">Rule Name</label>
                    <input type="text" name="name" value="{{ form.name.value|default:'' }}" required placeholder="e.g. Festive Offer 10%, Enterprise ₹500 Off" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:0.9rem;">
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px; margin-bottom:16px;">
                    <div>
                        <label style="display:block; font-size:0.8rem; font-weight:700; color:var(--slate); margin-bottom:6px;">Discount Type</label>
                        {{ form.discount_type }}
                    </div>
                    <div>
                        <label style="display:block; font-size:0.8rem; font-weight:700; color:var(--slate); margin-bottom:6px;">Discount Value (% or ₹)</label>
                        <input type="number" step="0.01" name="value" value="{{ form.value.value|default:'0.00' }}" required style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:0.9rem;">
                    </div>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px; margin-bottom:16px;">
                    <div>
                        <label style="display:block; font-size:0.8rem; font-weight:700; color:var(--slate); margin-bottom:6px;">Min Order Value (₹) [Threshold]</label>
                        <input type="number" step="0.01" name="min_order_value" value="{{ form.min_order_value.value|default:'' }}" placeholder="Optional threshold" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:0.9rem;">
                    </div>
                    <div>
                        <label style="display:block; font-size:0.8rem; font-weight:700; color:var(--slate); margin-bottom:6px;">Max Usage Limit</label>
                        <input type="number" name="usage_limit" value="{{ form.usage_limit.value|default:'' }}" placeholder="Blank = unlimited" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:0.9rem;">
                    </div>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px; margin-bottom:16px;">
                    <div>
                        <label style="display:block; font-size:0.8rem; font-weight:700; color:var(--slate); margin-bottom:6px;">Valid From</label>
                        {{ form.valid_from }}
                    </div>
                    <div>
                        <label style="display:block; font-size:0.8rem; font-weight:700; color:var(--slate); margin-bottom:6px;">Valid Until</label>
                        {{ form.valid_until }}
                    </div>
                </div>

                <div style="margin-bottom:24px;">
                    <label style="display:flex; align-items:center; gap:8px; font-size:0.85rem; font-weight:600; color:var(--navy); cursor:pointer;">
                        <input type="checkbox" name="is_active" {% if form.is_active.value or not form.is_bound %}checked{% endif %}>
                        Active Rule (evaluated on eligible invoices)
                    </label>
                </div>

                <div style="display:flex; gap:12px; justify-content:flex-end;">
                    <a href="{% url 'discount_rule_list' %}" class="button button-secondary">Cancel</a>
                    <button type="submit" class="button button-primary">Save Discount Rule</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
