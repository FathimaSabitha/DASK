
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brightloop | Update Customer</title>

    <link rel="stylesheet" href="{% static 'core/css/customer_management.css' %}">
</head>
<body>

<div class="container">

    <div class="header">
        <h2>Update Customer Details</h2>
        <p>Modify customer account information</p>
    </div>

    <div class="form-card">

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="actions">

                <button type="submit">
                    Save Changes
                </button>

                <a class="back-link" href="{% url 'customer_detail' customer.pk %}">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
